<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ShipIntel - إدخال شحنة جديدة</title>
    <style>
        body { background-color: #0b1329; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
        .top-bar { background: #1e3a8a; padding: 15px 25px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-weight: bold; }
        .section-title { color: #60a5fa; border-bottom: 2px solid #1e3a8a; padding-bottom: 5px; margin-bottom: 15px; font-size: 16px; }
        .form-grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; background: #111c44; border: 1px solid #1e293b; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; text-align: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #1e293b; padding: 10px; text-align: center; }
        th { background: #1e3a8a; color: #fff; }
        td input { background: transparent; border: none; text-align: center; color: #fff; }
        .footer-actions { display: flex; gap: 15px; margin-top: 30px; justify-content: flex-end; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background: #10b981; color: white; }
        .btn-print { background: #0ea5e9; color: white; }
        .btn-n8n { background: #f59e0b; color: #000; }
    </style>
</head>
<body>

    <!-- الترويسة العلوية للإعدادات والمستخدم -->
    <div class="top-bar">
        <span>الإعدادات | المستخدم: FILOON</span>
        <span>SHIP INTEL (شيب إنتل)</span>
    </div>

    <!-- بيانات الشحنة والعميل -->
    <div class="section-title">بيانات الشحنة والعميل</div>
    <div class="form-grid">
        <div class="form-group">
            <label>اسم المرسل:</label>
            <input type="text" placeholder="أدخل اسم المرسل">
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="text" placeholder="رقم الهاتف">
        </div>
    </div>
    <div class="form-grid">
        <div class="form-group">
            <label>اسم المستلم:</label>
            <input type="text" placeholder="أدخل اسم المستلم">
        </div>
        <div class="form-group">
            <label>الوجهة / المدينة:</label>
            <input type="text" placeholder="المكلا - حضرموت" value="المكلا - حضرموت">
        </div>
    </div>

    <!-- جدول البوليصة والأصناف -->
    <div class="section-title" style="margin-top: 30px;">جدول البوليصة والأصناف</div>
    <table>
        <thead>
            <tr>
                <th>م</th>
                <th>وصف الأصناف</th>
                <th>الكمية</th>
                <th>الوزن</th>
                <th>سعر الشحنة</th>
                <th>الإجمالي</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td><input type="text" placeholder="وصف الصنف"></td>
                <td><input type="text" value="1"></td>
                <td><input type="text" placeholder="0.00"></td>
                <td><input type="text" placeholder="0.00"></td>
                <td><input type="text" placeholder="0.00" readonly></td>
            </tr>
        </tbody>
    </table>

    <!-- الإجمالي الكلي -->
    <div style="margin-top: 20px; font-size: 18px; font-weight: bold; text-align: left;">
        إجمالي الكلفات والرسوم: [ 0.00 ريال ]
    </div>

    <!-- الأزرار السفلية (الحفظ والطباعة والأتمتة) -->
    <div class="footer-actions">
        <button class="btn btn-n8n">ربط n8n / إرسال</button>
        <button class="btn btn-print">طباعة البوليصة</button>
        <button class="btn btn-save">حفظ البيانات</button>
    </div>

</body>
</html>
