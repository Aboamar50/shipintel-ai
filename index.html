<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipIntel AI - Global Logistics & Freight Tracking</title>
    <style>
        :root {
            --bg: #0b1329;
            --card: #131f3d;
            --primary: #38bdf8;
            --accent: #0284c7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 25px; line-height: 1.5; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1e293b; }
        .brand-box { display: flex; align-items: center; gap: 15px; }
        .brand { font-size: 28px; font-weight: 900; letter-spacing: 0.5px; }
        .brand span { color: var(--primary); }
        .tagline { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 1px; }
        .lang-btn { background: #1e293b; color: var(--primary); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .lang-btn:hover { background: var(--primary); color: #0b1329; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin: 25px 0; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .stat-card h3 { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .stat-card .num { font-size: 26px; font-weight: bold; color: var(--text); }
        .search-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 25px; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background: #0b1329; color: #fff; font-size: 15px; }
        .search-box button { background: var(--primary); color: #0b1329; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        th { background: #0e172e; color: var(--muted); font-size: 13px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .no-data { text-align: center; padding: 25px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-box">
                <div>
                    <div class="brand">Ship<span>Intel</span> <span>AI</span></div>
                    <div class="tagline" id="taglineText">ENTERPRISE LOGISTICS INTELLIGENCE</div>
                </div>
            </div>
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h3 id="stat1Label">إجمالي الشحنات المدارة</h3><div class="num">1,248</div></div>
            <div class="stat-card"><h3 id="stat2Label">حاويات في عرض البحر</h3><div class="num" style="color: var(--primary);">42</div></div>
            <div class="stat-card"><h3 id="stat3Label">شحنات قيد التخليص الجمركي</h3><div class="num" style="color: var(--warning);">18</div></div>
            <div class="stat-card"><h3 id="stat4Label">تم التسليم بنجاح</h3><div class="num" style="color: var(--success);">1,188</div></div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="أدخل رقم بوليصة الشحن (B/L) أو رقم الحاوية...">
            <button id="searchBtn" onclick="performSearch()">تتبع الشحنة</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th id="thBL">رقم البوليصة</th>
                    <th id="thContainer">الحاوية</th>
                    <th id="thOrigin">ميناء المغادرة</th>
                    <th id="thDest">ميناء الوصول</th>
                    <th id="thETA">موعد الوصول المتوقع</th>
                    <th id="thStatus">الحالة</th>
                </tr>
            </thead>
            <tbody id="shipmentTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <script>
        const translations = {
            ar: {
                tagline: "ENTERPRISE LOGISTICS INTELLIGENCE",
                langBtn: "English",
                stat1: "إجمالي الشحنات المدارة",
                stat2: "حاويات في عرض البحر",
                stat3: "شحنات قيد التخليص الجمركي",
                stat4: "تم التسليم بنجاح",
                searchPlaceholder: "أدخل رقم بوليصة الشحن (B/L) أو رقم الحاوية...",
                searchBtn: "تتبع الشحنة",
                thBL: "رقم البوليصة",
                thContainer: "الحاوية",
                thOrigin: "ميناء المغادرة",
                thDest: "ميناء الوصول",
                thETA: "موعد الوصول المتوقع",
                thStatus: "الحالة",
                statusTransit: "في الطريق البحري",
                statusCleared: "تم الفسح الجمركي",
                noResults: "لم يتم العثور على شحنة مطابقة لهذا الرقم."
            },
            en: {
                tagline: "ENTERPRISE LOGISTICS INTELLIGENCE",
                langBtn: "العربية",
                stat1: "Total Managed Shipments",
                stat2: "Containers In Transit",
                stat3: "Customs Clearance",
                stat4: "Successfully Delivered",
                searchPlaceholder: "Enter B/L Number or Container ID...",
                searchBtn: "Track Shipment",
                thBL: "B/L Number",
                thContainer: "Container No.",
                thOrigin: "Port of Origin",
                thDest: "Port of Destination",
                thETA: "Estimated Arrival (ETA)",
                thStatus: "Status",
                statusTransit: "In Maritime Transit",
                statusCleared: "Customs Cleared",
                noResults: "No shipment found matching this query."
            }
        };

        const shipments = [
            { bl: "MSKU-982341", container: "MSKU7382910", origin_ar: "شنغهاي (الصين)", origin_en: "Shanghai (China)", dest_ar: "عدن / المكلا", dest_en: "Aden / Mukalla", eta: "2026-11-02", status: "transit" },
            { bl: "CMAU-441029", container: "CMAU1029384", origin_ar: "جبل علي (دبي)", origin_en: "Jebel Ali (Dubai)", dest_ar: "جدة الإسلامي", dest_en: "Jeddah Port", eta: "2026-10-24", status: "cleared" },
            { bl: "HLCU-109283", container: "HLCU5562019", origin_ar: "إسطنبول (تركيا)", origin_en: "Istanbul (Turkey)", dest_ar: "الحديدة / المكلا", dest_en: "Hodeidah / Mukalla", eta: "2026-11-10", status: "transit" }
        ];

        let currentLang = 'ar';

        function renderTable(data) {
            const tbody = document.getElementById("shipmentTableBody");
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data">${translations[currentLang].noResults}</td></tr>`;
                return;
            }
            data.forEach(item => {
                const tr = document.createElement("tr");
                const origin = currentLang === 'ar' ? item.origin_ar : item.origin_en;
                const dest = currentLang === 'ar' ? item.dest_ar : item.dest_en;
                const statusBadge = item.status === 'transit'
                    ? `<span class="badge badge-warning">${translations[currentLang].statusTransit}</span>`
                    : `<span class="badge badge-success">${translations[currentLang].statusCleared}</span>`;

                tr.innerHTML = `
                    <td><strong>${item.bl}</strong></td>
                    <td>${item.container}</td>
                    <td>${origin}</td>
                    <td>${dest}</td>
                    <td>${item.eta}</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyLanguage(lang) {
            currentLang = lang;
            const root = document.getElementById("htmlRoot");
            root.setAttribute("lang", lang);
            root.setAttribute("dir", lang === 'ar' ? 'rtl' : 'ltr');

            const t = translations[lang];
            document.getElementById("taglineText").innerText = t.tagline;
            document.getElementById("langToggleBtn").innerText = t.langBtn;
            document.getElementById("stat1Label").innerText = t.stat1;
            document.getElementById("stat2Label").innerText = t.stat2;
            document.getElementById("stat3Label").innerText = t.stat3;
            document.getElementById("stat4Label").innerText = t.stat4;
            document.getElementById("searchInput").placeholder = t.searchPlaceholder;
            document.getElementById("searchBtn").innerText = t.searchBtn;
            document.getElementById("thBL").innerText = t.thBL;
            document.getElementById("thContainer").innerText = t.thContainer;
            document.getElementById("thOrigin").innerText = t.thOrigin;
            document.getElementById("thDest").innerText = t.thDest;
            document.getElementById("thETA").innerText = t.thETA;
            document.getElementById("thStatus").innerText = t.thStatus;

            renderTable(shipments);
        }

        function toggleLanguage() {
            const nextLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLanguage(nextLang);
        }

        function performSearch() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            if (!query) {
                renderTable(shipments);
                return;
            }
            const filtered = shipments.filter(s => 
                s.bl.toLowerCase().includes(query) || 
                s.container.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        document.getElementById("searchInput").addEventListener("keyup", function(e) {
            if (e.key === "Enter") performSearch();
            if (this.value === "") renderTable(shipments);
        });

        // Initialize
        applyLanguage('ar');
    </script>
</body>
</html>
